name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore ThreeDEye.FileProcessor.slnx

      - name: Build
        run: dotnet build ThreeDEye.FileProcessor.slnx -c Release --no-restore

      - name: Test
        run: dotnet test ThreeDEye.FileProcessor.slnx -c Release --no-build
